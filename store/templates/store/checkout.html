{% extends 'store/base.html' %}

{% block content %}

<style>
    /* =========================
       CRAZY CHECKOUT EXPERIENCE
       ========================= */

    .checkout-page {
        min-height: 90vh;
        position: relative;
        overflow: hidden;
        padding: 70px 0;
        background:
            radial-gradient(circle at 10% 20%, rgba(99, 102, 241, .25), transparent 30%),
            radial-gradient(circle at 90% 80%, rgba(236, 72, 153, .22), transparent 30%),
            linear-gradient(135deg, #080b18, #10152b 50%, #080b18);
        color: white;
    }

    /* Animated background blobs */
    .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: .5;
        pointer-events: none;
        animation: floatGlow 8s ease-in-out infinite alternate;
    }

    .glow-one {
        width: 300px;
        height: 300px;
        background: #6366f1;
        top: -100px;
        left: -80px;
    }

    .glow-two {
        width: 350px;
        height: 350px;
        background: #ec4899;
        right: -120px;
        bottom: -120px;
        animation-delay: 2s;
    }

    .glow-three {
        width: 180px;
        height: 180px;
        background: #06b6d4;
        left: 45%;
        top: 15%;
        opacity: .25;
        animation-delay: 4s;
    }

    @keyframes floatGlow {
        from {
            transform: translate(0, 0) scale(1);
        }
        to {
            transform: translate(40px, -30px) scale(1.2);
        }
    }

    /* Tiny floating particles */
    .particle {
        position: absolute;
        width: 5px;
        height: 5px;
        background: #fff;
        border-radius: 50%;
        opacity: .5;
        box-shadow: 0 0 15px #fff;
        animation: particleFloat linear infinite;
    }

    .particle:nth-child(1) {
        left: 10%;
        top: 80%;
        animation-duration: 9s;
    }

    .particle:nth-child(2) {
        left: 25%;
        top: 60%;
        animation-duration: 12s;
    }

    .particle:nth-child(3) {
        left: 70%;
        top: 75%;
        animation-duration: 10s;
    }

    .particle:nth-child(4) {
        left: 85%;
        top: 30%;
        animation-duration: 14s;
    }

    .particle:nth-child(5) {
        left: 50%;
        top: 90%;
        animation-duration: 8s;
    }

    @keyframes particleFloat {
        0% {
            transform: translateY(0) scale(.5);
            opacity: 0;
        }
        20% {
            opacity: .7;
        }
        100% {
            transform: translateY(-500px) scale(1.5);
            opacity: 0;
        }
    }

    /* Main container */
    .checkout-wrapper {
        position: relative;
        z-index: 2;
        max-width: 900px;
        margin: auto;
    }

    .checkout-header {
        text-align: center;
        margin-bottom: 35px;
        animation: fadeDown .8s ease forwards;
    }

    .checkout-header .badge {
        display: inline-block;
        padding: 8px 18px;
        border-radius: 50px;
        background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,255,255,.15);
        backdrop-filter: blur(15px);
        color: #a5b4fc;
        font-size: 13px;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 15px;
    }

    .checkout-header h1 {
        font-size: clamp(42px, 7vw, 72px);
        font-weight: 900;
        line-height: 1;
        margin: 0;
        background: linear-gradient(
            90deg,
            #fff,
            #a5b4fc,
            #f9a8d4,
            #67e8f9,
            #fff
        );
        background-size: 300% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: gradientText 5s linear infinite;
    }

    .checkout-header p {
        color: #94a3b8;
        margin-top: 15px;
        font-size: 16px;
    }

    @keyframes gradientText {
        0% { background-position: 0% center; }
        100% { background-position: 300% center; }
    }

    @keyframes fadeDown {
        from {
            opacity: 0;
            transform: translateY(-30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Card */
    .checkout-card {
        position: relative;
        padding: 40px;
        border-radius: 28px;
        background: rgba(15, 23, 42, .65);
        border: 1px solid rgba(255,255,255,.12);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        box-shadow:
            0 30px 80px rgba(0,0,0,.45),
            inset 0 1px rgba(255,255,255,.08);
        animation: cardEnter 1s cubic-bezier(.16,1,.3,1) forwards;
        overflow: hidden;
    }

    .checkout-card::before {
        content: "";
        position: absolute;
        width: 500px;
        height: 2px;
        top: 0;
        left: -100%;
        background: linear-gradient(
            90deg,
            transparent,
            #818cf8,
            #f472b6,
            transparent
        );
        animation: scanLine 4s linear infinite;
    }

    @keyframes scanLine {
        to {
            left: 100%;
        }
    }

    @keyframes cardEnter {
        from {
            opacity: 0;
            transform: translateY(50px) scale(.96);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    /* Address section */
    .address-label {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 12px;
        color: #e2e8f0;
    }

    .address-icon {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        box-shadow: 0 8px 25px rgba(99,102,241,.35);
    }

    .address-box {
        position: relative;
    }

    .address-box textarea {
        width: 100%;
        min-height: 150px;
        resize: vertical;
        padding: 18px;
        border-radius: 18px;
        border: 1px solid rgba(255,255,255,.12);
        outline: none;
        background: rgba(2,6,23,.55);
        color: white;
        font-size: 16px;
        transition: all .3s ease;
        box-sizing: border-box;
    }

    .address-box textarea::placeholder {
        color: #64748b;
    }

    .address-box textarea:focus {
        border-color: #818cf8;
        box-shadow:
            0 0 0 4px rgba(99,102,241,.12),
            0 0 35px rgba(99,102,241,.15);
        background: rgba(2,6,23,.75);
        transform: translateY(-2px);
    }

    /* Order summary */
    .order-summary {
        margin-top: 28px;
        padding: 22px;
        border-radius: 20px;
        background: linear-gradient(
            135deg,
            rgba(99,102,241,.12),
            rgba(236,72,153,.08)
        );
        border: 1px solid rgba(255,255,255,.08);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .total-label {
        color: #94a3b8;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .total-price {
        font-size: 36px;
        font-weight: 900;
        background: linear-gradient(90deg, #67e8f9, #a5b4fc, #f9a8d4);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: pricePulse 2s ease-in-out infinite;
    }

    @keyframes pricePulse {
        50% {
            filter: drop-shadow(0 0 15px rgba(129,140,248,.45));
            transform: scale(1.04);
        }
    }

    /* Button */
    .place-order-btn {
        position: relative;
        width: 100%;
        margin-top: 25px;
        padding: 18px 25px;
        border: none;
        border-radius: 18px;
        cursor: pointer;
        overflow: hidden;
        color: white;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: .5px;
        background: linear-gradient(
            90deg,
            #6366f1,
            #8b5cf6,
            #ec4899,
            #6366f1
        );
        background-size: 300% 100%;
        box-shadow:
            0 15px 35px rgba(99,102,241,.3),
            inset 0 1px rgba(255,255,255,.25);
        transition: transform .25s ease, box-shadow .25s ease;
        animation: buttonGradient 4s linear infinite;
    }

    .place-order-btn:hover {
        transform: translateY(-4px) scale(1.01);
        box-shadow:
            0 20px 50px rgba(236,72,153,.35),
            0 0 35px rgba(99,102,241,.2);
    }

    .place-order-btn:active {
        transform: translateY(1px) scale(.99);
    }

    .place-order-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -120%;
        width: 80%;
        height: 100%;
        transform: skewX(-20deg);
        background: linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            transparent
        );
        animation: buttonShine 3s infinite;
    }

    .place-order-btn span {
        position: relative;
        z-index: 2;
    }

    @keyframes buttonGradient {
        0% { background-position: 0% center; }
        100% { background-position: 300% center; }
    }

    @keyframes buttonShine {
        0% { left: -120%; }
        45%, 100% { left: 150%; }
    }

    /* Secure checkout */
    .secure {
        text-align: center;
        margin-top: 18px;
        color: #64748b;
        font-size: 13px;
    }

    .secure span {
        color: #34d399;
    }

    /* Mobile */
    @media (max-width: 768px) {
        .checkout-page {
            padding: 45px 15px;
        }

        .checkout-card {
            padding: 25px;
            border-radius: 22px;
        }

        .order-summary {
            align-items: flex-start;
            gap: 10px;
            flex-direction: column;
        }

        .total-price {
            font-size: 32px;
        }
    }
</style>

<div class="checkout-page">

    <!-- Ambient glow -->
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
    <div class="glow glow-three"></div>

    <!-- Floating particles -->
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

    <div class="container checkout-wrapper">

        <div class="checkout-header">
            <div class="badge">✦ Secure Checkout</div>
            <h1>Almost Yours.</h1>
            <p>Drop your delivery details and let's make it happen.</p>
        </div>

        <form method="post" class="checkout-card">
            {% csrf_token %}

            <div class="address-label">
                <div class="address-icon">📍</div>
                <span>Where should we deliver?</span>
            </div>

            <div class="address-box">
                <textarea
                    required
                    name="address"
                    placeholder="Enter your complete delivery address..."
                ></textarea>
            </div>

            <div class="order-summary">
                <div>
                    <div class="total-label">Your total</div>
                    <small style="color:#64748b;">Ready to place your order</small>
                </div>

                <div class="total-price">
                    ₹{{ total }}
                </div>
            </div>

            <button type="submit" class="place-order-btn">
                <span>🚀 Place My Order</span>
            </button>

            <div class="secure">
                <span>●</span> Your checkout is secure & protected
            </div>

        </form>

    </div>
</div>

{% endblock %}
