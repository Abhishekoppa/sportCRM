{% extends 'store/base.html' %}{% block content %}<div class="container py-5"><h1>Order History</h1>{% for o in orders %}<a class="card p-4 mb-3 text-decoration-none" href="{% url 'order_detail' o.pk %}"><div class="d-flex justify-content-between"><b>Order #{{o.pk}}</b><span>{{o.status}}</span></div><span>{{o.created_at|date:'d M Y'}} · ₹{{o.total}}</span></a>{% empty %}<p>No orders yet.</p>{% endfor %}</div>{% endblock %}
