<div class="card product-card h-100 position-relative">
    <div class="product-card-img-wrap position-relative overflow-hidden">
        <a href="{{p.get_absolute_url}}">
            <img src="{{p.get_image}}" class="card-img-top product-card-img" alt="{{p.name}}" loading="lazy">
        </a>
        {% if p.code %}
        <span class="badge bg-dark bg-opacity-75 text-cyan border border-cyan-subtle position-absolute top-0 start-0 m-2 px-2 py-1 font-monospace" style="font-size: 11px;">
            {{p.code}}
        </span>
        {% endif %}
        {% if p.celebrity %}
        <div class="celeb-micro-badge position-absolute bottom-0 start-0 m-2 d-flex align-items-center gap-1 bg-dark bg-opacity-80 px-2 py-1 rounded-pill border border-secondary" title="Endorsed by {{p.celebrity.name}}">
            <img src="{{p.celebrity.image}}" alt="{{p.celebrity.name}}" class="rounded-circle" style="width: 18px; height: 18px; object-fit: cover;">
            <span class="text-white" style="font-size: 10px;">{{p.celebrity.name}}</span>
        </div>
        {% endif %}
    </div>

    <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between align-items-center mb-1">
            <small class="text-muted text-uppercase" style="font-size: 11px; letter-spacing: 0.5px;">{{p.category.name}}</small>
            <div class="small text-warning">★ {{p.rating}}</div>
        </div>

        <h6 class="card-title fw-bold text-white mb-2">
            <a href="{{p.get_absolute_url}}" class="text-white text-decoration-none product-title-link">{{p.name}}</a>
        </h6>

        <div class="d-flex align-items-baseline gap-2 mb-3 mt-auto">
            <span class="fw-bold text-info fs-5">₹{{ p.price|floatformat:0 }}</span>
            {% if p.old_price %}
            <span class="text-muted text-decoration-line-through small">₹{{ p.old_price|floatformat:0 }}</span>
            {% endif %}
        </div>

        <div class="d-flex gap-2">
            <a class="btn btn-outline-info btn-sm flex-grow-1" href="{{p.get_absolute_url}}">
                <i class="bi bi-eye me-1"></i>View
            </a>
            <form action="{% url 'add_cart' p.pk %}" method="post" class="flex-shrink-0">
                {% csrf_token %}
                <button class="btn btn-primary btn-sm px-3" title="Add to Cart">
                    <i class="bi bi-cart-plus"></i>
                </button>
            </form>
        </div>
    </div>
</div>
