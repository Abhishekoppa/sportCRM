<div class="card product-card h-100"><img src="{{p.get_image}}" class="card-img-top"><div class="card-body"><small class="text-muted">{{p.category.name}}</small><h6>{{p.name}}</h6><div class="fw-bold">₹{{p.price}}</div><div class="small text-warning">★ {{p.rating}}</div><div class="d-flex gap-2 mt-2"><a class="btn btn-outline-primary btn-sm" href="{{p.get_absolute_url}}">View</a><form action="{% url 'add_cart' p.pk %}" method="post">{% csrf_token %}<button class="btn btn-primary btn-sm">Add</button></form></div></div></div>
